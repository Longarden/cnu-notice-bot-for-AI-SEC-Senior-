name: CNU Notice Greeter

# 봇에게 /start 를 보낸 사람에게 채널 링크를 안내하고 구독자 명부를 갱신한다.
# 텔레그램은 미확인 update를 24시간만 보관하므로, 하루 한 번짜리 notify.yml에만
# 의존하면 그 사이 들어온 사람을 놓칠 수 있다. 그래서 이 경로만 따로 자주 돈다.
# 공지 다이제스트는 보내지 않으므로 자주 돌아도 알림이 늘어나지 않는다.

on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnu-notice-state
  cancel-in-progress: false

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Greet new subscribers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_LINK: ${{ vars.TELEGRAM_CHANNEL_LINK }}
          GREET_ONLY: "1"
        run: python notify.py

      - name: Commit roster
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- subscribers.enc 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "명부 변경 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "chore: update subscriber roster [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
