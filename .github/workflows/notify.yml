name: CNU Notice Notifier

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# seen.json / subscribers.enc 를 저장소에 다시 커밋해야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

# 상태 파일을 커밋하는 워크플로우끼리는 절대 동시에 돌면 안 된다(greet.yml과 공유).
concurrency:
  group: cnu-notice-state
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_LINK: ${{ vars.TELEGRAM_CHANNEL_LINK }}
          NAVER_USERNAME: ${{ secrets.NAVER_USERNAME }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: python notify.py

      # 발송이 실패해도 명부(subscribers.enc)는 갱신됐을 수 있으므로 always().
      # seen.json 은 발송 성공 시에만 파이썬이 기록하므로 여기서 따질 필요가 없다.
      - name: Commit state files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- seen.json subscribers.enc 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "상태 변경 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "chore: update notifier state [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
